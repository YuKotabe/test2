<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジェスチャー・クエスト</title>
<style>
  :root{
    --bg-top:#1b2a4a;
    --bg-bottom:#0c1526;
    --panel:#12203a;
    --accent:#ffb454;
    --accent2:#5ee6c9;
    --beam:#8ad4ff;
    --danger:#ff5d5d;
    --text:#e9edf5;
    --sub:#8fa0bf;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }
  h1{
    font-size:22px;
    letter-spacing:.02em;
    margin:4px 0 2px;
  }
  p.lead{
    color:var(--sub);
    font-size:13px;
    margin:0 0 18px;
    text-align:center;
    max-width:560px;
    line-height:1.7;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:640px;
  }
  #game{
    width:100%;
    display:block;
    background:linear-gradient(180deg,#28406b 0%,#1a2c4d 55%,#16233d 100%);
    border-radius:16px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .cam-wrap{
    position:absolute;
    top:12px;
    right:12px;
    width:120px;
    height:90px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.08);
    background:#000;
  }
  #preview{
    width:100%;
    height:100%;
    display:block;
    transform:scaleX(-1);
  }
  video{display:none;}
  .hud{
    position:absolute;
    top:14px;
    left:16px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    max-width:380px;
  }
  .badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(4px);
    white-space:nowrap;
  }
  .badge.score{color:var(--accent);}
  .badge.gesture{color:var(--accent2); transition:background .15s;}
  .badge.gesture.active{background:rgba(94,230,201,.22);}
  .progress-wrap{
    position:absolute;
    left:16px;
    right:16px;
    bottom:14px;
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .1s linear;
  }
  .controls{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:16px;
  }
  button{
    appearance:none;
    border:none;
    padding:12px 26px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:#1a1206;
    transition:transform .1s ease;
  }
  button:active{transform:scale(.96);}
  button.secondary{
    background:rgba(255,255,255,.1);
    color:var(--text);
  }
  button:disabled{
    opacity:.4;
    cursor:default;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px 24px;
    margin-top:18px;
    color:var(--sub);
    font-size:13px;
  }
  .legend span.key{
    color:var(--text);
    font-weight:700;
  }
  .overlay-msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    text-align:center;
    background:rgba(10,15,28,.75);
    border-radius:16px;
    font-size:16px;
    padding:20px;
  }
  .overlay-msg.hidden{display:none;}
  .overlay-msg .big{
    font-size:26px;
    font-weight:800;
    color:var(--accent);
  }
  .overlay-msg .big.clear{
    color:var(--accent2);
  }
</style>
</head>
<body>

<h1>ジェスチャー・クエスト</h1>
<p class="lead">
  インカメラに手をかざしてね。
  <span style="color:var(--text);font-weight:700;">グー✊ = 待機</span>、
  <span style="color:var(--text);font-weight:700;">パー✋ = ジャンプ</span>、
  <span style="color:var(--text);font-weight:700;">チョキ✌️ = ビーム</span>、
  <span style="color:var(--text);font-weight:700;">人差し指👉 = 指した方向へ移動</span>。
  ボールをよけながら奥のゴールを目指そう。
</p>

<div class="stage">
  <canvas id="game" width="640" height="360"></canvas>

  <div class="hud">
    <div class="badge score" id="scoreBadge">SCORE 0</div>
    <div class="badge gesture" id="gestureBadge">認識待ち…</div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="preview" width="120" height="90"></canvas>
  </div>

  <div class="overlay-msg" id="overlay">
    <div class="big" id="overlayTitle">準備OK?</div>
    <div id="overlayText" style="color:var(--sub);max-width:380px;">「カメラを開始」を押してカメラを許可してください。手が映ったらスタートします。</div>
  </div>
</div>

<div class="controls">
  <button id="startBtn">カメラを開始</button>
  <button id="restartBtn" class="secondary" disabled>もう一度あそぶ</button>
</div>

<div class="legend">
  <div><span class="key">✊ グー</span> → 待機</div>
  <div><span class="key">✋ パー</span> → ジャンプ</div>
  <div><span class="key">✌️ チョキ</span> → ビーム発射</div>
  <div><span class="key">👉 人差し指</span> → 指した方向へ移動</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>

<script>
(function(){
  "use strict";

  // ---------- DOM ----------
  const video = document.getElementById('video');
  const previewCanvas = document.getElementById('preview');
  const previewCtx = previewCanvas.getContext('2d');
  const gameCanvas = document.getElementById('game');
  const ctx = gameCanvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreBadge = document.getElementById('scoreBadge');
  const gestureBadge = document.getElementById('gestureBadge');
  const progressBar = document.getElementById('progressBar');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');

  // ---------- Game constants ----------
  const W = gameCanvas.width, H = gameCanvas.height;
  const GROUND_Y = H - 60;
  const GRAVITY = 0.85;
  const JUMP_VELOCITY = -15.5;
  const LEAD_OFFSET = 110;      // player's preferred screen x when not near world edges
  const CHAR_W = 34, CHAR_H = 46;
  const WORLD_WIDTH = 3200;     // total length of the level
  const GOAL_X = WORLD_WIDTH - 70;
  const MOVE_SPEED = 4.0;
  const BEAM_SPEED = 13;
  const BEAM_COOLDOWN = 16;     // frames between auto-fired beams while holding choki
  const POINT_DEADZONE = 0.035; // normalized-coordinate deadzone for pointing direction

  // ---------- Game state ----------
  let state = 'idle'; // idle | running | gameover | clear
  let playerWorldX = 60;
  let charY = GROUND_Y - CHAR_H;
  let velY = 0;
  let jumping = false;
  let facingDir = 1;
  let obstacles = [];
  let beams = [];
  let beamCooldownTimer = 0;
  let score = 0;
  let frame = 0;
  let cameraX = 0;

  // ---------- Gesture state ----------
  let stableGesture = 'none';   // 'fist' | 'open' | 'chop' | 'point' | 'none'
  let gestureStreak = 0;
  const STREAK_NEEDED = 3;
  let prevStableGesture = 'none';
  let pointDir = 0; // -1 left, 0 none, 1 right (from the current gesture reading)

  function generateObstacles(){
    const arr = [];
    let x = 500;
    while(x < WORLD_WIDTH - 300){
      arr.push({ worldX: x, r: 14 + Math.random()*8, alive:true });
      x += 240 + Math.random()*220;
    }
    return arr;
  }

  function resetGame(){
    playerWorldX = 60;
    charY = GROUND_Y - CHAR_H;
    velY = 0;
    jumping = false;
    facingDir = 1;
    obstacles = generateObstacles();
    beams = [];
    beamCooldownTimer = 0;
    score = 0;
    frame = 0;
    state = 'running';
    overlay.classList.add('hidden');
    restartBtn.disabled = true;
  }

  function gameOver(){
    state = 'gameover';
    overlayTitle.textContent = 'ゲームオーバー';
    overlayTitle.className = 'big';
    overlayText.textContent = 'スコア ' + score + '。グー✊→やり直しの合図で再スタートできます。';
    overlay.classList.remove('hidden');
    restartBtn.disabled = false;
  }

  function clearGame(){
    state = 'clear';
    overlayTitle.textContent = '🎉 ゴール！クリア！';
    overlayTitle.className = 'big clear';
    overlayText.textContent = 'スコア ' + score + '。お見事！';
    overlay.classList.remove('hidden');
    restartBtn.disabled = false;
  }

  function doJump(){
    if(!jumping && state === 'running'){
      velY = JUMP_VELOCITY;
      jumping = true;
    }
  }

  function fireBeam(){
    if(state !== 'running') return;
    beams.push({
      worldX: playerWorldX + facingDir * (CHAR_W*0.7),
      dir: facingDir
    });
  }

  // ---------- Drawing ----------
  function drawBackground(){
    ctx.clearRect(0,0,W,H);
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#28406b');
    grad.addColorStop(0.55,'#1a2c4d');
    grad.addColorStop(1,'#16233d');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // distant hills (parallax tied to camera position)
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for(let i=0;i<5;i++){
      const cx = (i*300 - cameraX*0.3) % (W+300);
      const wrapped = cx < -150 ? cx + (W+300) : cx;
      ctx.beginPath();
      ctx.ellipse(wrapped, GROUND_Y-10, 140, 40, 0, Math.PI, 0);
      ctx.fill();
    }

    // ground
    ctx.fillStyle = '#0f1a2e';
    ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx.strokeStyle = 'rgba(255,180,84,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    // scrolling ground ticks tied to camera position
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    const tickSpacing = 40;
    const offset = ((cameraX % tickSpacing)+tickSpacing) % tickSpacing;
    for(let x = -offset; x < W; x += tickSpacing){
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y+6);
      ctx.lineTo(x-14, H);
      ctx.stroke();
    }
  }

  function drawGoal(){
    const screenX = GOAL_X - cameraX;
    if(screenX < -60 || screenX > W+60) return;
    // pole
    ctx.fillStyle = '#cfd8e8';
    ctx.fillRect(screenX, GROUND_Y-140, 5, 140);
    // flag
    ctx.fillStyle = '#5ee6c9';
    ctx.beginPath();
    ctx.moveTo(screenX+5, GROUND_Y-140);
    ctx.lineTo(screenX+42, GROUND_Y-125);
    ctx.lineTo(screenX+5, GROUND_Y-110);
    ctx.closePath();
    ctx.fill();
    // base
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(screenX+2, GROUND_Y+4, 16, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCharacter(charScreenX){
    ctx.save();
    ctx.translate(charScreenX, charY);
    if(facingDir < 0){
      ctx.translate(CHAR_W, 0);
      ctx.scale(-1, 1);
    }

    const squish = jumping ? Math.max(0.35, 1 - (GROUND_Y-CHAR_H-charY)/140) : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(CHAR_W/2, GROUND_Y-charY+8, 16*squish, 5*squish, 0, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = '#5ee6c9';
    ctx.fillRect(4, 14, CHAR_W-8, CHAR_H-18);
    // head
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath();
    ctx.arc(CHAR_W/2, 12, 13, 0, Math.PI*2);
    ctx.fill();
    // headband
    ctx.fillStyle = '#ffb454';
    ctx.fillRect(CHAR_W/2-13, 4, 26, 6);
    // eye (front-facing side)
    ctx.fillStyle = '#12203a';
    ctx.fillRect(CHAR_W/2+2, 10, 3, 3);
    // legs
    ctx.fillStyle = '#2e4a7a';
    ctx.fillRect(6, CHAR_H-4, 8, 6);
    ctx.fillRect(CHAR_W-14, CHAR_H-4, 8, 6);

    ctx.restore();
  }

  function drawObstacle(ob){
    const screenX = ob.worldX - cameraX;
    if(screenX < -40 || screenX > W+40) return;
    const y = GROUND_Y - ob.r;
    const grad = ctx.createRadialGradient(screenX-4, y-4, 2, screenX, y, ob.r);
    grad.addColorStop(0, '#ff9d9d');
    grad.addColorStop(1, '#ff5d5d');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(screenX, y, ob.r, 0, Math.PI*2);
    ctx.fill();
  }

  function drawBeam(b){
    const screenX = b.worldX - cameraX;
    if(screenX < -30 || screenX > W+30) return;
    const y = charY + CHAR_H/2;
    ctx.save();
    ctx.shadowColor = 'var(--beam)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#8ad4ff';
    ctx.fillRect(screenX - 10*b.dir, y-3, 20, 6);
    ctx.restore();
  }

  function circleRectCollide(cx, cy, r, rx, ry, rw, rh){
    const closestX = Math.max(rx, Math.min(cx, rx+rw));
    const closestY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-closestX, dy = cy-closestY;
    return (dx*dx+dy*dy) < r*r;
  }

  function update(){
    frame++;

    // horizontal movement from pointing gesture
    if(stableGesture === 'point' && pointDir !== 0){
      playerWorldX += pointDir * MOVE_SPEED;
      facingDir = pointDir;
    }
    playerWorldX = Math.max(0, Math.min(WORLD_WIDTH, playerWorldX));

    // vertical physics (jump)
    if(jumping){
      velY += GRAVITY;
      charY += velY;
      if(charY >= GROUND_Y - CHAR_H){
        charY = GROUND_Y - CHAR_H;
        velY = 0;
        jumping = false;
      }
    }

    // camera follows player, clamped to world bounds
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, playerWorldX - LEAD_OFFSET));
    const charScreenX = playerWorldX - cameraX;

    // beam auto-fire while holding choki
    if(stableGesture === 'chop'){
      if(beamCooldownTimer <= 0){
        fireBeam();
        beamCooldownTimer = BEAM_COOLDOWN;
      }
    }
    if(beamCooldownTimer > 0) beamCooldownTimer--;

    // update beams
    for(let i=beams.length-1;i>=0;i--){
      const b = beams[i];
      b.worldX += BEAM_SPEED * b.dir;
      const sx = b.worldX - cameraX;
      if(sx < -60 || sx > W+60){ beams.splice(i,1); continue; }
    }

    // beam vs obstacle collisions
    for(const ob of obstacles){
      if(!ob.alive) continue;
      for(let i=beams.length-1;i>=0;i--){
        const b = beams[i];
        if(Math.abs(b.worldX - ob.worldX) < ob.r + 10){
          ob.alive = false;
          beams.splice(i,1);
          score += 15;
          break;
        }
      }
    }

    // player vs obstacle collision
    const charRectY = charY + 10, charRectH = CHAR_H - 14;
    for(const ob of obstacles){
      if(!ob.alive) continue;
      const screenX = ob.worldX - cameraX;
      if(circleRectCollide(screenX, GROUND_Y - ob.r, ob.r*0.85, charScreenX+4, charRectY, CHAR_W-8, charRectH)){
        gameOver();
      }
    }

    score = Math.max(score, Math.floor(playerWorldX/10));

    // win condition
    if(playerWorldX >= GOAL_X){
      clearGame();
    }

    // progress bar
    progressBar.style.width = Math.min(100, (playerWorldX / GOAL_X) * 100) + '%';
  }

  function render(){
    drawBackground();
    const charScreenX = playerWorldX - cameraX;
    drawGoal();
    obstacles.forEach(ob => { if(ob.alive) drawObstacle(ob); });
    beams.forEach(drawBeam);
    drawCharacter(charScreenX);
    scoreBadge.textContent = 'SCORE ' + score;

    // debug status line
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText(
      `state:${state} gesture:${stableGesture} x:${Math.round(playerWorldX)}/${WORLD_WIDTH} dir:${facingDir} beams:${beams.length}`,
      10, H - 8
    );
  }

  function loop(){
    if(state === 'running'){
      update();
    } else {
      render(); // keep drawing the idle/gameover/clear frame without advancing physics
      requestAnimationFrame(loop);
      return;
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Gesture recognition (MediaPipe Hands) ----------
  function dist(a,b){
    const dx=a.x-b.x, dy=a.y-b.y;
    return Math.sqrt(dx*dx+dy*dy);
  }

  // distance-from-wrist based "extended" check: robust even when the hand
  // is rotated sideways (needed for the pointing gesture).
  function fingerExtended(lm, wrist, tipIdx, pipIdx){
    return dist(wrist, lm[tipIdx]) > dist(wrist, lm[pipIdx]) * 1.15;
  }

  function classifyGesture(lm){
    const wrist = lm[0];
    const idx  = fingerExtended(lm, wrist, 8, 6);
    const mid  = fingerExtended(lm, wrist, 12, 10);
    const ring = fingerExtended(lm, wrist, 16, 14);
    const pink = fingerExtended(lm, wrist, 20, 18);
    const count = [idx, mid, ring, pink].filter(Boolean).length;

    let gesture = 'none';
    if(count === 0){
      gesture = 'fist';
    } else if(count >= 3){
      gesture = 'open';
    } else if(count === 1 && idx){
      gesture = 'point';
    } else if(count === 2 && idx && mid && !ring && !pink){
      gesture = 'chop';
    }

    // pointing direction from wrist -> index tip (raw, unmirrored camera coords).
    // Raw x is flipped relative to the user's own left/right (camera faces them),
    // so a NEGATIVE dx corresponds to the user's own right side.
    let dir = 0;
    if(gesture === 'point'){
      const dx = lm[8].x - wrist.x;
      if(dx < -POINT_DEADZONE) dir = 1;       // user's right -> move right
      else if(dx > POINT_DEADZONE) dir = -1;  // user's left  -> move left
    }

    return { gesture, dir };
  }

  function onResults(results){
    previewCtx.save();
    previewCtx.clearRect(0,0,previewCanvas.width, previewCanvas.height);
    previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

    let detected = 'none';
    let dir = 0;
    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
      const lm = results.multiHandLandmarks[0];
      if(window.drawConnectors && window.HAND_CONNECTIONS){
        window.drawConnectors(previewCtx, lm, window.HAND_CONNECTIONS, {color:'#5ee6c9', lineWidth:2});
        window.drawLandmarks(previewCtx, lm, {color:'#ffb454', lineWidth:1, radius:2});
      }
      const result = classifyGesture(lm);
      detected = result.gesture;
      dir = result.dir;
    }
    previewCtx.restore();

    pointDir = dir;

    // debounce with a short streak so a single noisy frame can't flip state
    if(detected === stableGesture){
      gestureStreak = 0;
    } else {
      gestureStreak++;
      if(gestureStreak >= STREAK_NEEDED){
        stableGesture = detected;
        gestureStreak = 0;
      }
    }

    // start the game on the first recognized gesture (before the jump/beam
    // checks below, so the very first gesture isn't "consumed" just starting it)
    if(state === 'idle' && stableGesture !== 'none'){
      resetGame();
    }
    // restart on fist after game over / clear
    if((state === 'gameover' || state === 'clear') && stableGesture === 'fist' && prevStableGesture !== 'fist'){
      resetGame();
    }

    // rising edge: -> open triggers a jump
    if(stableGesture === 'open' && prevStableGesture !== 'open'){
      doJump();
    }
    prevStableGesture = stableGesture;

    // HUD
    const labels = {
      open: '✋ パー（ジャンプ）',
      fist: '✊ グー（待機）',
      chop: '✌️ チョキ（ビーム）',
      point: dir === 1 ? '👉 右へ移動' : dir === -1 ? '👈 左へ移動' : '👆 指差し中',
      none: '認識中…'
    };
    gestureBadge.textContent = labels[stableGesture] || labels.none;
    gestureBadge.classList.toggle('active', stableGesture !== 'none' && stableGesture !== 'fist');
  }

  let cameraStarted = false;
  async function startCamera(){
    if(cameraStarted) return;
    cameraStarted = true;
    startBtn.disabled = true;
    overlayTitle.textContent = 'カメラ起動中…';
    overlayText.textContent = 'ブラウザのカメラ許可ダイアログが出たら「許可」を押してください。';

    const hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    try{
      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 320,
        height: 240
      });
      await camera.start();
      overlayTitle.textContent = '手をかざしてね';
      overlayText.textContent = 'グー✊かパー✋を映すとゲームが始まります。';
    } catch(err){
      overlayTitle.textContent = 'カメラを開始できませんでした';
      overlayText.textContent = 'カメラへのアクセスを許可してから、もう一度お試しください。';
      startBtn.disabled = false;
      cameraStarted = false;
    }
  }

  startBtn.addEventListener('click', startCamera);
  restartBtn.addEventListener('click', () => {
    resetGame();
  });

  // ---------- keyboard fallback (for testing without a camera) ----------
  const keysDown = new Set();
  window.addEventListener('keydown', (e)=>{
    keysDown.add(e.code);
    if(e.code === 'Space'){
      if(state === 'idle'){ resetGame(); }
      else doJump();
    }
    if(e.code === 'KeyF'){
      fireBeam();
    }
  });
  window.addEventListener('keyup', (e)=> keysDown.delete(e.code));

  // merge keyboard movement into pointDir when no camera gesture is active
  setInterval(()=>{
    if(stableGesture !== 'point'){
      if(keysDown.has('ArrowRight')){ stableGesture='point'; pointDir=1; }
      else if(keysDown.has('ArrowLeft')){ stableGesture='point'; pointDir=-1; }
    } else if(!keysDown.has('ArrowRight') && !keysDown.has('ArrowLeft') && pointDir !== 0 && !cameraStarted){
      stableGesture = 'none'; pointDir = 0;
    }
  }, 16);

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
