<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0"><title>🎤 声で色を変えよう</title><style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

    background: #222;
    color: white;

    transition:
        background-color 1s ease;
}

.container {
    width: 90%;
    max-width: 500px;

    text-align: center;
}

h1 {
    font-size: 28px;
    margin-bottom: 30px;
}

.status {
    font-size: 20px;
    margin: 20px 0;
}

.result {
    min-height: 70px;

    padding: 20px;

    border-radius: 20px;

    background: rgba(0,0,0,0.25);

    font-size: 20px;

    word-break: break-word;
}

button {
    width: 100%;

    padding: 18px;

    margin: 8px 0;

    border: none;
    border-radius: 50px;

    font-size: 20px;
    font-weight: bold;

    color: white;
    background: #2196f3;

    touch-action: manipulation;
}

button:active {
    transform: scale(0.97);
}

#stopButton {
    background: #555;
}

.color-name {
    font-size: 36px;
    font-weight: bold;
    margin: 20px 0;
}

</style></head><body><div class="container"><h1>🎤 声で色を変えよう</h1>

<button id="startButton">
    🎙️ マイクON
</button>

<button id="stopButton">
    ⏹️ マイクOFF
</button>

<div class="status" id="status">
    🔴 マイクOFF
</div>

<div class="color-name" id="colorName">
    ---
</div>

<div class="result" id="result">
    「赤」「青」「夜空」などと<br>
    話しかけてください
</div>

</div><script>

/* =====================================
   音声認識
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =====================================
   色の辞書
===================================== */

const colors = {

    // 基本色

    "赤": "#ff0000",
    "あか": "#ff0000",

    "青": "#0066ff",
    "あお": "#0066ff",

    "緑": "#00aa44",
    "みどり": "#00aa44",

    "黄色": "#ffff00",
    "きいろ": "#ffff00",

    "紫": "#8800cc",
    "むらさき": "#8800cc",

    "ピンク": "#ff69b4",

    "オレンジ": "#ff8800",
    "橙": "#ff8800",

    "水色": "#00bfff",

    "茶色": "#8b4513",

    "灰色": "#808080",
    "グレー": "#808080",

    "白": "#ffffff",

    "黒": "#000000",


    // イメージ

    "夜空": "#071A52",

    "星空": "#101C45",

    "夕焼け": "#FF5733",

    "朝焼け": "#FF9966",

    "海": "#0088CC",

    "深海": "#003366",

    "森": "#228B22",

    "草原": "#66AA33",

    "桜": "#FFB7C5",

    "雪": "#EAF7FF",

    "炎": "#FF4500",

    "太陽": "#FFD700",

    "月": "#E8E8D0",

    "宇宙": "#12002F"

};


/* =====================================
   変数
===================================== */

let recognition = null;

let listening = false;

let restarting = false;


/* =====================================
   色を変更
===================================== */

function changeColor(text) {

    for (const word in colors) {

        if (text.includes(word)) {

            const color = colors[word];

            document.body.style.backgroundColor =
                color;

            document.getElementById(
                "colorName"
            ).textContent = word;

            document.getElementById(
                "result"
            ).textContent =
                "「" + text + "」";

            return true;
        }
    }

    return false;
}


/* =====================================
   音声認識を作る
===================================== */

function createRecognition() {

    if (!SpeechRecognition) {

        document.getElementById(
            "status"
        ).textContent =
            "❌ このブラウザは音声認識に対応していません";

        return null;
    }


    const r = new SpeechRecognition();


    /*
       日本語
    */

    r.lang = "ja-JP";


    /*
       スマホではcontinuous=trueでも
       認識が勝手に終了することがある
    */

    r.continuous = true;


    /*
       最終結果だけ取得
    */

    r.interimResults = false;


    /*
       認識候補
    */

    r.maxAlternatives = 3;


    /* -------------------------
       認識開始
    ------------------------- */

    r.onstart = function() {

        restarting = false;

        document.getElementById(
            "status"
        ).textContent =
            "🟢 聞いています…";
    };


    /* -------------------------
       音声認識結果
    ------------------------- */

    r.onresult = function(event) {

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            if (
                event.results[i].isFinal
            ) {

                const text =
                    event.results[i][0]
                    .transcript
                    .replace(/\s/g, "");


                console.log(
                    "認識:",
                    text
                );


                const found =
                    changeColor(text);


                if (!found) {

                    document.getElementById(
                        "result"
                    ).textContent =
                        "「" +
                        text +
                        "」";
                }
            }
        }
    };


    /* -------------------------
       エラー
    ------------------------- */

    r.onerror = function(event) {

        console.log(
            "音声認識エラー:",
            event.error
        );


        /*
           マイク許可拒否
        */

        if (
            event.error ===
            "not-allowed"
        ) {

            listening = false;

            document.getElementById(
                "status"
            ).textContent =
                "🔴 マイクの使用が許可されていません";

            return;
        }


        /*
           一時的なエラーなら
           onendで再開
        */

    };


    /* -------------------------
       認識終了
    ------------------------- */

    r.onend = function() {

        console.log(
            "音声認識終了"
        );


        /*
           マイクOFFなら終了
        */

        if (!listening) {

            document.getElementById(
                "status"
            ).textContent =
                "🔴 マイクOFF";

            return;
        }


        /*
           スマホでは勝手に終了する
           ことがあるので再起動
        */

        if (!restarting) {

            restarting = true;

            setTimeout(
                restartRecognition,
                500
            );
        }

    };


    return r;
}


/* =====================================
   音声認識を開始
===================================== */

function startRecognition() {

    if (!recognition) {

        recognition =
            createRecognition();
    }


    if (!recognition) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            "start error:",
            error
        );
    }
}


/* =====================================
   音声認識を再開
===================================== */

function restartRecognition() {

    if (!listening) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            "restart error:",
            error
        );


        /*
           少し待って再試行
        */

        setTimeout(
            restartRecognition,
            1000
        );
    }
}


/* =====================================
   マイクON
===================================== */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function() {

        if (listening) {
            return;
        }


        listening = true;


        document.getElementById(
            "status"
        ).textContent =
            "🟡 マイクを起動しています…";


        startRecognition();

    }
);


/* =====================================
   マイクOFF
===================================== */

document.getElementById(
    "stopButton"
).addEventListener(
    "click",
    function() {

        listening = false;


        if (recognition) {

            try {

                recognition.stop();

            } catch (error) {

                console.log(error);

            }
        }


        document.getElementById(
            "status"
        ).textContent =
            "🔴 マイクOFF";

    }
);

</script></body></html>
